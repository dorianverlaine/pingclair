name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 🎩 Everything builds on the hosted Ubuntu runners now: the dev binaries
  # are native per-architecture builds (x86_64 and arm64 runners), so the
  # smoke tests execute the artifact they just built — a cross-compiled
  # arm64 binary cannot run on an x86_64 host. The release image
  # (deployment/Dockerfile) is Ubuntu-based as well, and the docker-image
  # job below builds and boots that exact Dockerfile, so packaging mistakes
  # are still caught in CI.
  test:
    name: Build & test (Ubuntu, Rust 1.88)
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            make \
            g++ \
            perl \
            pkg-config \
            clang \
            libclang-dev \
            git \
            curl \
            ca-certificates

      - uses: actions/checkout@v5

      - name: Install Rust 1.88
        # 🎯 Downloaded to a file and run as a second, separate command —
        # never `curl | sh`. A pipe's exit status is the last command's only,
        # so a transient `curl: (35) Recv failure: Connection reset by peer`
        # (hit on 2026-07-31) fed `sh` an empty script, `sh` exited 0 having
        # done nothing, and this step reported success. Rust was never
        # installed; every later step failed with a `cargo: command not
        # found` that pointed nowhere near the actual cause. `--retry` covers
        # the transient case; the final `cargo --version` is what actually
        # closes the gap — no later step can silently run without a toolchain.
        run: |
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -sSf \
            https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile default --default-toolchain 1.88.0
          rm -f /tmp/rustup-init.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # 🔑 Keyed on Cargo.lock so a dependency bump invalidates it; on a
          # cache miss the restore-keys fallback still saves recompiling
          # everything unchanged.
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-

      - name: Check shell syntax
        run: bash -n scripts/*.sh benchmarks/scripts/*.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --verbose

      - name: Run tests
        # 🎲 `test_websocket_upgrade_tunnels_bytes_in_both_directions` is a
        # known upstream (Pingora) flake: it fails intermittently with no
        # code change, so one red run is noise, not signal. The loop reruns
        # the full suite when that test is the *only* failure — any other
        # failure, or one that survives all three attempts, is still
        # reported loudly. The test source is never modified for this.
        run: |
          flaky_suffix="test_websocket_upgrade_tunnels_bytes_in_both_directions"
          max_attempts=3
          attempt=0
          log="/tmp/cargo-test.log"
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt + 1))
            set +e
            cargo test --locked --workspace --verbose >"$log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "✅ cargo test passed (attempt ${attempt}/${max_attempts})"
              # 📊 The full output lives in the log file; print the
              # per-binary run counts and results so the record shows the
              # whole suite actually ran, not just this summary line.
              grep -E 'running [0-9]+ test|test result:' "$log" || true
              exit 0
            fi
            failed="$(awk '/^failures:$/{f=1; next} f && /^    [^ ]/{gsub(/^ +/, ""); print} f && /^$/{f=0}' "$log" | sort -u)"
            if [ -z "$failed" ]; then
              break
            fi
            if [ "$(printf '%s\n' "$failed" | wc -l)" -ne 1 ] || ! printf '%s\n' "$failed" | grep -q "${flaky_suffix}$"; then
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "⚠️  ${failed} is a known upstream flake (attempt ${attempt}/${max_attempts}); rerunning the suite"
            fi
          done
          echo "::error::cargo test failed on: $(printf '%s' "$failed" | tr '\n' ' ')"
          tail -n 80 "$log"
          exit 1

      - name: Verify the single-BoringSSL invariant
        # 🔐 quiche only runs on BoringSSL and pingora-core defaults to
        # OpenSSL; the two collide on libcrypto symbols at link time (has
        # crashed the binary at startup before). This is the same check
        # GUARDRAILS asks a human to run by hand — it belongs in CI instead,
        # where a stray `pingora-openssl` or `openssl-sys` dependency fails
        # the build instead of waiting to be noticed.
        run: |
          if cargo tree -i openssl-sys > /tmp/openssl-sys-tree.txt 2>/dev/null; then
            echo "::error::openssl-sys is present in the dependency tree — this must stay BoringSSL-only:"
            cat /tmp/openssl-sys-tree.txt
            exit 1
          fi
          echo "✅ no openssl-sys in the dependency tree"

  # 🐳 Builds the exact Dockerfile the production host runs, and boots it.
  #
  # This is the job that would have caught today's incident: the Dockerfile
  # had drifted (wrong Rust version, missing git and perl) because
  # nothing had built it since H3 moved onto tokio-quiche's dependency tree.
  # GUARDRAILS says it plainly — "a build script no CI job runs is code with
  # no tests" — so this job exists to make that statement false going forward.
  docker-image:
    name: Build & smoke-test the release image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Build the release image
        run: docker build -f deployment/Dockerfile -t pingclair:ci .

      - name: Version must be reported and match the crate
        run: |
          version_output="$(docker run --rm pingclair:ci version)"
          echo "$version_output"
          echo "$version_output" | grep -q "Pingclair v" || {
            echo "::error::unexpected 'pingclair version' output"
            exit 1
          }

      - name: A real Pingclairfile must validate inside the image
        # 🧭 Exercises the same binary, the same libc, the same BoringSSL build
        # that will actually run in production — `cargo test` on the host
        # proves the logic is right, this proves the *artifact* is right.
        run: |
          docker run --rm -v "$PWD/examples:/examples:ro" \
            pingclair:ci validate /examples/full_featured.pingclair

  # 🔒 New RustSec advisories land on a schedule this repo does not control,
  # so this runs on every push rather than only at release time. Per
  # docs/GUARDRAILS.md, an exception to a real finding needs a written risk
  # acceptance — this job is what makes silently living with one impossible.
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo-audit and the advisory database
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  # 🧪 Per-push development binaries. Day 33 owns the versioned release
  # artifacts; this job only makes the current main testable sooner. The
  # artifacts are named "-dev" and never represent a stable release — treat
  # every run as a snapshot of a moving tree.
  dev-binaries:
    name: Dev binaries - ${{ matrix.platform.name }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: x86_64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: aarch64

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        # 🧱 Native per-architecture builds on hosted Ubuntu runners: the
        # x86_64 leg runs on ubuntu-latest and the aarch64 leg on the native
        # ubuntu-24.04-arm runner. No cross toolchain is needed, and the
        # smoke test can execute the binary it just built — a cross-compiled
        # arm64 binary cannot run on an x86_64 host (hit on the ubuntu-26.04
        # attempt: "Exec format error"). boring-sys needs cmake + g++ for
        # BoringSSL, clang/libclang-dev for bindgen and perl for its scripts.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            perl \
            pkg-config \
            clang \
            libclang-dev \
            git \
            curl

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # 🔑 Keyed on Cargo.lock so a dependency bump invalidates it, with
          # the matrix leg appended so each target keeps its own entry. The
          # shared `ubuntu-cargo-` namespace lets the dev binaries warm from
          # the test job's cache on the same architecture.
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.platform.target }}
          restore-keys: |
            ubuntu-cargo-

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.platform.target }}

      - name: Smoke test the binary
        run: |
          binary="target/${{ matrix.platform.target }}/release/pingclair"
          version_output="$("$binary" version)"
          echo "$version_output"
          echo "$version_output" | grep -q "Pingclair v"
          "$binary" validate examples/full_featured.pingclair

      - name: Package and checksum
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar -czf pingclair-linux-${{ matrix.platform.key }}-dev.tar.gz pingclair
          shasum -a 256 pingclair-linux-${{ matrix.platform.key }}-dev.tar.gz > SHA256SUMS-dev-${{ matrix.platform.key }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pingclair-linux-${{ matrix.platform.key }}-dev
          path: |
            target/${{ matrix.platform.target }}/release/pingclair-linux-${{ matrix.platform.key }}-dev.tar.gz
            target/${{ matrix.platform.target }}/release/SHA256SUMS-dev-${{ matrix.platform.key }}.txt
          retention-days: 14

  # 🚀 Rolling `dev` release. `install.sh --dev` downloads from here, so the
  # per-push binaries need a stable public URL even though they are never a
  # stable release. The `dev` tag is force-moved on every push — last writer
  # wins, which is acceptable for a solo iteration loop and is exactly why
  # the tag is named "dev".
  publish-dev-release:
    name: Publish rolling dev release
    if: github.event_name != 'pull_request'
    needs: dev-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download dev binaries
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify the checksums
        # 🔒 A release page is a trust boundary even for machine-built
        # snapshots: refuse to publish a tarball whose checksum does not
        # match what the build produced. Each arch ships its own sums file,
        # so verify both against their tarball before anything goes live.
        run: |
          shasum -a 256 -c SHA256SUMS-dev-x86_64.txt
          shasum -a 256 -c SHA256SUMS-dev-aarch64.txt

      - name: Write the release notes
        run: |
          {
            echo "Snapshot of \`main\` at [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}), built by [run #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "**Not a stable release.** The \`dev\` tag is a moving target: it is force-replaced on every push while the project is in rapid iteration, so the binary you install today will not be the same one you install next week."
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sudo bash -s -- --dev'
            echo '```'
            echo
            echo "## Assets"
            ls -lh pingclair-linux-*-dev.tar.gz SHA256SUMS-dev-*.txt | sed 's/^/- /'
          } > /tmp/dev-release-notes.md

      - name: Replace the rolling dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🗑️ Only delete what actually exists; the first push of the day
          # has no `dev` release yet, and a delete that fails for a real
          # reason must not be swallowed by `|| true`.
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes --cleanup-tag
          fi
          gh release create dev \
            pingclair-linux-x86_64-dev.tar.gz \
            pingclair-linux-aarch64-dev.tar.gz \
            SHA256SUMS-dev-x86_64.txt \
            SHA256SUMS-dev-aarch64.txt \
            --title "Development builds (unstable)" \
            --notes-file /tmp/dev-release-notes.md

  # 🐳 Rolling development image. The `docker-image` job above proves the
  # artifact boots on the native runner; this job publishes the same
  # Dockerfile as a mutable `dev` tag plus an immutable commit-SHA tag, so a
  # test deployment can either follow the latest snapshot or pin one build.
  # Each architecture is built natively on its own runner (x86_64 and arm64)
  # instead of emulating the arm64 leg with QEMU — the emulated build ran
  # past an hour; native builds finish in minutes. A final job merges the
  # two images into a single multi-arch manifest.
  # Explicitly not a release: the `dev` tag is a moving target by design
  # while the project is in rapid iteration.
  publish-dev-image:
    name: Publish dev image (${{ matrix.platform.name }})
    if: github.event_name != 'pull_request'
    needs: docker-image
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            tag: amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.platform.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: ${{ matrix.platform.platform }}
          push: true
          tags: |
            ghcr.io/dorianverlaine/pingclair:dev-${{ matrix.platform.tag }}

      - name: Smoke the ${{ matrix.platform.name }} image
        # 🧭 Runs the published per-architecture image natively on its own
        # runner, so each arch is verified before the manifest merge.
        run: |
          image="ghcr.io/dorianverlaine/pingclair:dev-${{ matrix.platform.tag }}"
          version_output="$(docker run --rm "$image" version)"
          echo "$version_output"
          echo "$version_output" | grep -q "Pingclair v"
          docker run --rm -v "$PWD/examples:/examples:ro" \
            "$image" validate /examples/full_featured.pingclair

  # 🧩 Merges the per-architecture images above into a single multi-arch
  # manifest. `imagetools create` only writes manifest metadata and never
  # copies layers, so this step finishes in seconds.
  publish-dev-manifest:
    name: Publish multi-arch dev manifest
    if: github.event_name != 'pull_request'
    needs: publish-dev-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/dorianverlaine/pingclair:dev \
            -t ghcr.io/dorianverlaine/pingclair:${{ github.sha }} \
            ghcr.io/dorianverlaine/pingclair:dev-amd64 \
            ghcr.io/dorianverlaine/pingclair:dev-arm64

      - name: Smoke the published image
        # 🧭 Smoke exactly what a test deployment will pull: `docker run`
        # resolves the multi-arch manifest to the runner's platform (amd64
        # here) and exercises the published artifact.
        run: |
          version_output="$(docker run --rm ghcr.io/dorianverlaine/pingclair:dev version)"
          echo "$version_output"
          echo "$version_output" | grep -q "Pingclair v"
          docker run --rm -v "$PWD/examples:/examples:ro" \
            ghcr.io/dorianverlaine/pingclair:dev validate /examples/full_featured.pingclair
