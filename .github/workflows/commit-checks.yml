name: Commit checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-whitespace:
    name: Check whitespace (git log --check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: git log --check
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          if ! git log --check --no-merges --format='%h %s' "$range"; then
            echo "::error::whitespace errors found in commits $range"
            exit 1
          fi
          echo "✅ no whitespace errors in $range"

  check-commit-subjects:
    name: Check commit subjects (emoji + conventional)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit subjects
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          err=0
          while read -r hash; do
            subject="$(git log -1 --format=%s "$hash")"
            if ! printf '%s' "$subject" | grep -qP '^[^\x00-\x7F]+ [a-z]+(\([a-z0-9_,/ -]+\))?: '; then
              echo "::error::$hash subject does not start with an emoji and a conventional type: \"$subject\""
              err=1
            fi
          done < <(git rev-list --no-merges "$range")
          if [ "$err" -ne 0 ]; then
            exit 1
          fi
          echo "✅ all commit subjects open with emoji + conventional type"

  check-dev-version:
    name: Workspace version on main is 0.0.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the dev version
        run: |
          set -Eeuo pipefail
          crate_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          # 🏷️ Only a release commit, cut off main by scripts/cut-release.sh,
          # carries a real version. Keeping main at 0.0.0 means no pull
          # request ever conflicts on a version bump, and a binary built from
          # main reports itself as `0.0.0-dev+<sha>` rather than as a release.
          if [ "${crate_version}" != "0.0.0" ]; then
            echo "::error::main carries version 0.0.0, but Cargo.toml says ${crate_version}; set versions with scripts/cut-release.sh on a release commit instead"
            exit 1
          fi
          echo "🏷️ workspace version is the dev placeholder 0.0.0"
