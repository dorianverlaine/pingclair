name: Postmerge CI

on:
  push:
    branches: [main]

concurrency:
  group: postmerge-ci-${{ github.ref_name }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 🧊 The same ordering rule as blocking CI: the environment is published, or
  # proven current, before the container jobs pull `:v1` (#300).
  builder:
    name: Builder image
    # 🔐 The called workflow's build and manifest jobs push to GHCR, and the
    # caller's permissions are their ceiling.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/builder-image.yml

  rust-ci-full:
    name: Rust CI full
    needs: builder
    uses: ./.github/workflows/rust-ci-full.yml
    secrets: inherit

  h3:
    name: HTTP/3
    uses: ./.github/workflows/h3.yml
    secrets: inherit

  results:
    name: Postmerge CI results
    if: ${{ always() }}
    needs: [rust-ci-full, h3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
