name: Docker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke-test the release image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the release image
        run: docker build -f deployment/Dockerfile -t pingclair:ci .

      - name: Version must be reported and match the crate
        run: |
          version_output="$(docker run --rm pingclair:ci version)"
          echo "$version_output"
          # 🏷️ The build context excludes `.git`, so an image of main cannot
          # name its commit and reports the bare dev marker. Anything that
          # looks like a release number here would be a build lying about
          # what it is.
          if [ "$version_output" != "v0.0.0-dev" ]; then
            echo "::error::expected v0.0.0-dev from an image of main, got ${version_output}"
            exit 1
          fi

      - name: A real Pingclairfile must validate inside the image
        run: |
          mkdir -p /tmp/pingclair-certs
          # 🔐 `validate` loads manual certificate files the way `run` does
          # (#218), so empty placeholder files are now refused. A throwaway
          # self-signed pair for the example's name is enough; world-readable
          # so the image's non-root user can open the key.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -nodes -days 1 -subj "/CN=example.com" \
            -addext "subjectAltName=DNS:example.com" \
            -keyout /tmp/pingclair-certs/example.com.key \
            -out /tmp/pingclair-certs/example.com.pem
          chmod 0644 /tmp/pingclair-certs/example.com.key /tmp/pingclair-certs/example.com.pem
          docker run --rm \
            -v "$PWD/examples:/examples:ro" \
            -v /tmp/pingclair-certs:/etc/pingclair/certs:ro \
            pingclair:ci validate /examples/full_featured.pingclair
