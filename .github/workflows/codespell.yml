name: Codespell

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install codespell
        run: |
          python3 -m venv /tmp/codespell-venv
          /tmp/codespell-venv/bin/pip install --quiet codespell==2.4.3

      - name: Run codespell
        run: /tmp/codespell-venv/bin/codespell

      - uses: ./.github/actions/check-clean-worktree
