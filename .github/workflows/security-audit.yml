name: Security audit

on:
  workflow_call:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.1

      - name: Cache cargo-audit and the advisory database
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked --version 0.22.2

      - name: Audit dependencies
        run: cargo audit

      - name: Audit the crates hidden behind [patch.crates-io]
        run: |
          set -Eeuo pipefail
          python3 -c 'import io,sys; p="Cargo.toml"; m=open(p).read(); s=m.index("[patch.crates-io]"); e=m.index("[profile.release]"); open(p,"w").write(m[:s]+m[e:])'
          if grep -q '^\[patch.crates-io\]' Cargo.toml; then
              echo "::error::failed to strip the patch section; the audit below would be a no-op" >&2
              exit 1
          fi
          cargo generate-lockfile
          if ! grep -A3 'name = "h2"' Cargo.lock | grep -q 'registry+'; then
              echo "::error::h2 did not resolve to the registry after stripping the patch" >&2
              exit 1
          fi
          cargo audit
          git restore Cargo.toml Cargo.lock

      - uses: ./.github/actions/check-clean-worktree
