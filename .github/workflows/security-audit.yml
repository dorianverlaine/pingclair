name: Security audit

on:
  workflow_call:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.1
        with:
          toolchain: 1.97.1

      - name: Cache cargo-audit and the advisory database
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked --version 0.22.2

      - name: Audit dependencies
        run: cargo audit

      - name: Audit the registry h2 hidden behind [patch.crates-io]
        run: |
          set -Eeuo pipefail
          python3 -c 'p="Cargo.toml"; m=open(p).read(); m=m.replace("h2 = { path = \"vendor/h2\" }\n", ""); open(p,"w").write(m)'
          if grep -q '^h2 = { path = "vendor/h2" }' Cargo.toml; then
              echo "::error::failed to remove the h2 patch; the audit below would miss the registry crate" >&2
              exit 1
          fi
          cargo generate-lockfile
          if ! grep -A3 'name = "h2"' Cargo.lock | grep -q 'registry+'; then
              echo "::error::h2 did not resolve to the registry after stripping the patch" >&2
              exit 1
          fi
          cargo audit
          git restore Cargo.toml Cargo.lock

      - uses: ./.github/actions/check-clean-worktree
