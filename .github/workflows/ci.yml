name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # ✅ Build and run the full suite. Lint and commit checks live in
  # their own workflows (lint.yml, commit-check.yml) so a failure in
  # one never masks the others — before 2026-08-02 fmt/clippy were
  # steps inside this job, a clippy failure skipped tests entirely,
  # and a reload test that had never once run in CI stayed invisible
  # behind two red pushes.
  # ============================================================
  test:
    name: Build & test (Ubuntu, Rust 1.97)
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        # 🧱 Keep in sync with deployment/Dockerfile, see docs/GUARDRAILS.md.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            make \
            g++ \
            perl \
            pkg-config \
            clang \
            libclang-dev \
            git \
            curl \
            ca-certificates

      - uses: actions/checkout@v5

      - name: Install Rust 1.97
        # 🎯 Downloaded to a file and run as a second, separate command —
        # never `curl | sh`. A pipe's exit status is the last command's only,
        # so a transient `curl: (35) Recv failure: Connection reset by peer`
        # (hit on 2026-07-31) fed `sh` an empty script, `sh` exited 0 having
        # done nothing, and this step reported success. Rust was never
        # installed; every later step failed with a `cargo: command not
        # found` that pointed nowhere near the actual cause. `--retry` covers
        # the transient case; the final `cargo --version` is what actually
        # closes the gap — no later step can silently run without a toolchain.
        run: |
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -sSf \
            https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile default --default-toolchain 1.97.1
          rm -f /tmp/rustup-init.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # 🔑 Keyed on Cargo.lock so a dependency bump invalidates it; on a
          # cache miss the restore-keys fallback still saves recompiling
          # everything unchanged.
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-

      - name: Build
        run: cargo build --locked --workspace --verbose

      - name: Run tests
        # 🎲 `test_websocket_upgrade_tunnels_bytes_in_both_directions` is a
        # known upstream (Pingora) flake: it fails intermittently with no
        # code change, so one red run is noise, not signal. The suite is
        # rerun only when *every* failure is a known flake — a real failure
        # sitting next to a flake must not be retried into silence (that is
        # exactly what happened on 2026-08-02 when the reload test failed
        # alongside the websocket flake and the old single-name check
        # reported red without either being diagnosed). The test source is
        # never modified for this.
        #
        # ⏳ Every entry carries the ISO date it was admitted, and expires
        # after 30 days. An allowlist with no expiry only ever grows: each
        # entry is added in a hurry with a good reason, nothing ever forces
        # anyone to revisit it, and the set of tests CI is allowed to ignore
        # ratchets upward forever. The expiry is what makes the entry come
        # back and ask to be justified again. Renewing an entry means
        # changing its date deliberately, which is a decision someone makes
        # rather than a default that holds by silence.
        run: |
          # 🗓️ Format is "<test name> <YYYY-MM-DD admitted>", one per line.
          # The date is when this entry was last deliberately admitted, not
          # when the flake was first seen: renewing it is an act, and the
          # act is editing this date.
          known_flaky=(
            "test_websocket_upgrade_tunnels_bytes_in_both_directions 2026-08-01"
          )

          # ⏳ Expiry runs before the suite, not after, so a stale entry
          # fails the job even on a fully green run. Checking it only on
          # failure would mean the allowlist is audited exactly when nobody
          # is looking at it.
          max_age_days=30
          now_epoch="$(date -u +%s)"
          stale=0
          for entry in "${known_flaky[@]}"; do
            flaky_name="${entry%% *}"
            flaky_date="${entry##* }"
            if ! entry_epoch="$(date -u -d "${flaky_date}" +%s 2>/dev/null)"; then
              echo "::error::known_flaky entry '${flaky_name}' has an unparseable date '${flaky_date}'; the format is '<test name> <YYYY-MM-DD>'"
              stale=1
              continue
            fi
            age_days=$(( (now_epoch - entry_epoch) / 86400 ))
            if [ "$age_days" -gt "$max_age_days" ]; then
              echo "::error::known_flaky entry '${flaky_name}' was admitted ${flaky_date}, ${age_days} days ago, past the ${max_age_days}-day limit. A flake that has survived 30 days is a bug, not a flake: it is reproducible enough to keep happening and nobody has found the cause. Fix it, or re-admit it deliberately by moving its date and writing down what was investigated."
              stale=1
            else
              echo "🎲 known flake '${flaky_name}' admitted ${flaky_date} (${age_days}d old, expires at ${max_age_days}d)"
            fi
          done
          if [ "$stale" -ne 0 ]; then
            exit 1
          fi

          max_attempts=3
          attempt=0
          log="/tmp/cargo-test.log"
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt + 1))
            set +e
            cargo test --locked --workspace --verbose >"$log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "✅ cargo test passed (attempt ${attempt}/${max_attempts})"
              break
            fi
            failed="$(awk '/^failures:$/{f=1; next} f && /^    [^ ]/{gsub(/^ +/, ""); print} f && /^$/{f=0}' "$log" | sort -u)"
            if [ -z "$failed" ]; then
              break
            fi
            # 🎲 The retry condition: every failed test must be in the
            # known-flaky set. Anything else is a real failure.
            # 🧩 The entry is "<name> <date>", so the name is everything
            # before the first space — comparing against the whole entry
            # would match nothing and quietly turn the retry off.
            flaky_only=1
            while IFS= read -r test_name; do
              [ -z "$test_name" ] && continue
              match=0
              for known in "${known_flaky[@]}"; do
                if [ "$test_name" = "${known%% *}" ]; then
                  match=1
                fi
              done
              if [ "$match" -ne 1 ]; then
                flaky_only=0
              fi
            done <<< "$failed"
            if [ "$flaky_only" -ne 1 ]; then
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "⚠️  $failed is/are known upstream flake(s) (attempt ${attempt}/${max_attempts}); rerunning the suite"
            fi
          done
          # 📊 The full output lives in the log file; print the per-binary
          # run counts and results so the record shows the whole suite
          # actually ran, not just the summary line, and fail on the last
          # attempt's result.
          grep -E 'running [0-9]+ test|test result:' "$log" || true
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo test failed on: $(printf '%s' "$failed" | tr '\n' ' ')"
            tail -n 80 "$log"
            exit 1
          fi
          # 📄 A compact summary on the job page
          {
            echo "## cargo test"
            echo '```'
            grep -E 'test result:' "$log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 📉 A brake on the fix:feat ratio. All-time this repository is 95 fixes
  # to 57 features; over the most recent 100 commits it is 39 to 12. That
  # acceleration is the thing being watched — a repository spending most of
  # its commits repairing itself is one where each new feature arrives with
  # its own repair pass already scheduled.
  #
  # ⚠️ TODO: this job is `continue-on-error: true` on purpose, because the
  # ratio is above the ceiling *right now* and a brake that fails from the
  # day it lands gets ignored rather than obeyed. **Remove
  # `continue-on-error` and make this blocking once the ratio is back under
  # 60 %** — the job's own green run is the signal that the moment has come.
  # ============================================================
  fix-ratio:
    name: Fix ratio
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5
        with:
          # 📚 The script reads the last 30 non-merge commits. The default
          # checkout is depth 1, which would make it fail as a shallow clone
          # (it refuses to judge a short window against a ceiling calibrated
          # for 30). 100 leaves room for merge commits and for a PR's
          # generated merge ref.
          fetch-depth: 100

      - name: Check the fix:feat ratio over the last 30 commits
        run: scripts/check-fix-ratio.sh

  # ============================================================
  # 🐳 Builds the exact Dockerfile the production host runs, and boots
  # it. This is the job that would have caught the 2026-07-31 incident:
  # the Dockerfile had drifted (wrong Rust version, missing git and
  # perl) because nothing had built it since H3 moved onto
  # tokio-quiche's dependency tree. GUARDRAILS says it plainly — "a
  # build script no CI job runs is code with no tests" — so this job
  # exists to make that statement false going forward.
  # ============================================================
  docker-image:
    name: Build & smoke-test the release image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Build the release image
        run: docker build -f deployment/Dockerfile -t pingclair:ci .

      - name: Version must be reported and match the crate
        # 🏷️ `version` prints the bare semver (v0.2.0-dev) since ca104ea, so
        # scripts can consume it without parsing a banner line.
        run: |
          version_output="$(docker run --rm pingclair:ci version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::unexpected 'pingclair version' output"
            exit 1
          }

      - name: A real Pingclairfile must validate inside the image
        # 🧭 Exercises the same binary, the same libc, the same BoringSSL build
        # that will actually run in production — `cargo test` on the host
        # proves the logic is right, this proves the *artifact* is right.
        # 🛡️ full_featured's manual-TLS block names /etc/pingclair/certs, and
        # `validate` fails closed when those files are missing (by design);
        # the check is existence only, so mounted placeholders suffice.
        run: |
          mkdir -p /tmp/pingclair-certs
          touch /tmp/pingclair-certs/example.com.pem /tmp/pingclair-certs/example.com.key
          docker run --rm \
            -v "$PWD/examples:/examples:ro" \
            -v /tmp/pingclair-certs:/etc/pingclair/certs:ro \
            pingclair:ci validate /examples/full_featured.pingclair
