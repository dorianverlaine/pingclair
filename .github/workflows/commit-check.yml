name: Commit checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ============================================================
  # 🪞 Commit hygiene — small checks that fail a PR on the commit
  # itself, modelled on nginx's check-whitespace.yaml and
  # check-commit-message.yaml jobs.
  # ============================================================
  check-whitespace:
    name: Check whitespace (git log --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: git log --check
        # 🪞 Same idea as nginx's check-whitespace.yaml: whitespace errors
        # in the new commits are reported per commit on the PR, before
        # they land in history. On push to main only the newest commit is
        # checked; on PR every commit in the range.
        # 🧩 `--no-merges`: a PR run checks out the auto-generated merge ref,
        # whose "Merge X into Y" commit is GitHub's, not a developer's — it
        # must not be judged by the house style.
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          if ! git log --check --no-merges --format='%h %s' "$range"; then
            echo "::error::whitespace errors found in commits $range"
            exit 1
          fi
          echo "✅ no whitespace errors in $range"

  check-commit-subjects:
    name: Check commit subjects (emoji + conventional)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit subjects
        # 🪞 House style: every subject opens with an emoji
        # followed by a conventional imperative summary (`type(scope):`).
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          err=0
          # 🧩 `--no-merges` for the same reason as the whitespace check:
          # the merge ref's auto-generated "Merge X into Y" commit has no
          # developer subject to hold to the house style.
          while read -r hash; do
            subject="$(git log -1 --format=%s "$hash")"
            # 🧩 `/` is allowed in a scope alongside `,`: the repository
            # spells multi-subsystem scopes both ways (`proxy,signal,api`
            # and `h1/h2`), and rewriting an already-pushed subject to
            # satisfy the narrower charset would cost a force-push over a
            # cosmetic difference.
            if ! printf '%s' "$subject" | grep -qP '^[^\x00-\x7F]+ [a-z]+(\([a-z0-9_,/ -]+\))?: '; then
              echo "::error::$hash subject does not start with an emoji and a conventional type: \"$subject\""
              err=1
            fi
          done < <(git rev-list --no-merges "$range")
          if [ "$err" -ne 0 ]; then
            exit 1
          fi
          echo "✅ all commit subjects open with emoji + conventional type"

  # ============================================================
  # 🏷️ Version drift — the counterpart to release.yml's verify-tag.
  # verify-tag guards the moment of release (the tag must match the
  # tree). This guards every moment in between: once v0.1.7 was tagged,
  # nothing forced the workspace off 0.1.7, and main drifted 173 commits
  # while `pingclair --version` kept answering v0.1.7. A user pasting
  # that into a bug report was naming two entirely different trees.
  # Modelled on nginx's check-version-bump.yaml, which release.yml
  # already cites but nothing implemented.
  # ============================================================
  check-version-bump:
    name: Workspace version is ahead of the newest release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare the workspace version against the newest release tag
        run: |
          set -Eeuo pipefail
          crate_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          git fetch --quiet --tags --force
          latest_tag="$(git tag -l 'v*.*.*' | sed 's/^v//' | sort -V | tail -1)"
          if [ -z "${latest_tag}" ]; then
            echo "✅ no release tag yet; nothing to be ahead of"
            exit 0
          fi
          echo "workspace: ${crate_version}    newest release tag: v${latest_tag}"

          # 🧭 The rule is simply that the release part of the workspace
          # version must be strictly greater than the newest release tag.
          # Stripping any pre-release suffix first is what makes `0.1.7-dev`
          # fail correctly: SemVer orders it *before* the released `0.1.7`,
          # so a tree carrying it is behind, not ahead.
          #
          # This also nags in the right place straight after a release. Tag
          # v0.2.0 on a tree that says 0.2.0 and the tag becomes the newest;
          # the next push then fails until the version moves to 0.2.1-dev.
          # That is the whole point — the bump is what stops the tree from
          # claiming to be a release it has already moved past.
          release_part="${crate_version%%-*}"
          if [ "${release_part}" = "${latest_tag}" ]; then
            echo "::error::the workspace release version ${release_part} is the newest release tag v${latest_tag}; bump it so a source build is distinguishable from the release"
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "${release_part}" "${latest_tag}" | sort -V | tail -1)"
          if [ "${newest}" != "${release_part}" ]; then
            echo "::error::the workspace version ${crate_version} is behind the newest release tag v${latest_tag}"
            exit 1
          fi
          echo "✅ ${crate_version} is ahead of the newest release tag v${latest_tag}"
