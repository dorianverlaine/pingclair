name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches the workspace version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version information
        id: info
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          crate_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          echo "crate_version=${crate_version}" >> "$GITHUB_OUTPUT"
          if [ "${tag#v}" != "${crate_version}" ]; then
            echo "::error::tag ${tag} does not match workspace version ${crate_version} — bump Cargo.toml before tagging"
            exit 1
          fi
          echo "✅ tag ${tag} matches workspace version ${crate_version}"

      - name: Verify the tag points at main
        run: |
          tag_sha="$(git rev-list -1 "${GITHUB_REF#refs/tags/}")"
          git fetch --quiet origin main --depth=1
          main_sha="$(git rev-list -1 FETCH_HEAD)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} points at ${tag_sha}, but main is at ${main_sha}"
            exit 1
          fi
          echo "✅ tag points at the tip of main"

  build-binaries:
    name: Build release binary (${{ matrix.platform.name }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            key: x86_64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: aarch64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-linux-deps

      - uses: ./.github/actions/setup-ci

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.platform.target }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.platform.target }}
          profile: release
          cache-scope: release-binaries

      - name: Build the release binary
        run: cargo +1.97.1 build --release --locked --target ${{ matrix.platform.target }}

      - name: Smoke test the binary
        run: |
          binary="${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release/pingclair"
          version_output="$("$binary" version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
          sudo mkdir -p /etc/pingclair/certs
          sudo touch /etc/pingclair/certs/example.com.pem /etc/pingclair/certs/example.com.key
          "$binary" validate examples/full_featured.pingclair

      - name: Package and checksum
        run: |
          cd "${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release"
          tar -czf pingclair-linux-${{ matrix.platform.key }}.tar.gz pingclair
          shasum -a 256 pingclair-linux-${{ matrix.platform.key }}.tar.gz > SHA256SUMS-${{ matrix.platform.key }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pingclair-linux-${{ matrix.platform.key }}
          path: |
            ${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release/pingclair-linux-${{ matrix.platform.key }}.tar.gz
            ${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release/SHA256SUMS-${{ matrix.platform.key }}.txt
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: [build-binaries, verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Verify the checksums
        run: |
          shasum -a 256 -c SHA256SUMS-x86_64.txt
          shasum -a 256 -c SHA256SUMS-aarch64.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.verify-tag.outputs.version }}"
          previous="$(git describe --abbrev=0 --tags --match 'v*.*.*' HEAD~1 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            notes="$(git log --format='- %s' "${previous}..HEAD")"
          else
            notes="First release."
          fi
          gh release create "$version" \
            pingclair-linux-x86_64.tar.gz \
            pingclair-linux-aarch64.tar.gz \
            SHA256SUMS-x86_64.txt \
            SHA256SUMS-aarch64.txt \
            --title "Pingclair $version" \
            --notes "$notes"

  publish-image:
    name: Publish release image (${{ matrix.platform.name }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tag: amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.platform.name }} image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deployment/Dockerfile
          platforms: ${{ matrix.platform.platform }}
          push: true
          tags: |
            ghcr.io/dorianverlaine/pingclair:${{ needs.verify-tag.outputs.version }}-${{ matrix.platform.tag }}

      - name: Smoke the ${{ matrix.platform.name }} image
        run: |
          image="ghcr.io/dorianverlaine/pingclair:${{ needs.verify-tag.outputs.version }}-${{ matrix.platform.tag }}"
          version_output="$(docker run --rm "$image" version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
          docker run --rm -v "$PWD/examples:/examples:ro" \
            "$image" validate /examples/full_featured.pingclair

  publish-image-manifest:
    name: Publish multi-arch release manifest
    needs: [publish-image, verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        run: |
          version="${{ needs.verify-tag.outputs.version }}"
          docker buildx imagetools create \
            -t ghcr.io/dorianverlaine/pingclair:"$version" \
            -t ghcr.io/dorianverlaine/pingclair:latest \
            ghcr.io/dorianverlaine/pingclair:"$version"-amd64 \
            ghcr.io/dorianverlaine/pingclair:"$version"-arm64
