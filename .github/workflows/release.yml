name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # 🪞 Mirrors an existing release into the R2 channel without cutting a new
  # tag: the recovery path when a mirror run fails after the release is already
  # published, and how an older release gets a channel pointer. Every other job
  # in this workflow builds from the tag that was pushed, so they are skipped
  # here.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror, for example v0.2.0-rc.3'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches the workspace version
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version information
        id: info
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          crate_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          echo "crate_version=${crate_version}" >> "$GITHUB_OUTPUT"
          if [ "${tag#v}" != "${crate_version}" ]; then
            echo "::error::tag ${tag} does not match workspace version ${crate_version} — bump Cargo.toml before tagging"
            exit 1
          fi
          echo "✅ tag ${tag} matches workspace version ${crate_version}"

      - name: Verify the tag points at main
        run: |
          tag_sha="$(git rev-list -1 "${GITHUB_REF#refs/tags/}")"
          git fetch --quiet origin main --depth=1
          main_sha="$(git rev-list -1 FETCH_HEAD)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} points at ${tag_sha}, but main is at ${main_sha}"
            exit 1
          fi
          echo "✅ tag points at the tip of main"

  build-binaries:
    name: Build release binary (${{ matrix.platform.name }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/dorianverlaine/pingclair-builder:v1
    defaults:
      run:
        working-directory: /workspace/pingclair
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            key: x86_64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Place the checkout at the image's workspace path
        run: |
          set -euo pipefail
          cp -a "${GITHUB_WORKSPACE}/." /workspace/pingclair/

      - uses: ./.github/actions/setup-ci

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.platform.target }}
          profile: release
          cache-scope: release-binaries
          cargo-home: /usr/local/cargo
          r2-endpoint: ${{ vars.R2_CACHE_ENDPOINT }}
          r2-bucket: ${{ vars.R2_CACHE_BUCKET }}
          r2-access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}

      - name: Build the release binary
        run: cargo +1.98.1 build --release --locked --target ${{ matrix.platform.target }}

      - name: Smoke test the binary
        run: |
          binary="${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release/pingclair"
          version_output="$("$binary" version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
          sudo mkdir -p /etc/pingclair/certs
          sudo touch /etc/pingclair/certs/example.com.pem /etc/pingclair/certs/example.com.key
          "$binary" validate examples/full_featured.pingclair

      - name: Package and checksum
        run: |
          cd "${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release"
          tar -czf pingclair-linux-${{ matrix.platform.key }}.tar.gz pingclair
          shasum -a 256 pingclair-linux-${{ matrix.platform.key }}.tar.gz > SHA256SUMS-${{ matrix.platform.key }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pingclair-linux-${{ matrix.platform.key }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.platform.target }}/release/pingclair-linux-${{ matrix.platform.key }}.tar.gz
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.platform.target }}/release/SHA256SUMS-${{ matrix.platform.key }}.txt
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: [build-binaries, verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Verify the checksums
        run: |
          shasum -a 256 -c SHA256SUMS-x86_64.txt
          shasum -a 256 -c SHA256SUMS-aarch64.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          version="${{ needs.verify-tag.outputs.version }}"
          assets=(
            pingclair-linux-x86_64.tar.gz
            pingclair-linux-aarch64.tar.gz
            SHA256SUMS-x86_64.txt
            SHA256SUMS-aarch64.txt
          )

          # 📝 A release worth announcing is written by hand before the tag is
          # pushed, and this job must not destroy those notes or fail because
          # they exist. So: attach the binaries to whatever is already there,
          # and only write a release when nobody did.
          if gh release view "$version" >/dev/null 2>&1; then
            echo "📎 Release $version already exists — attaching binaries to it."
            gh release upload "$version" "${assets[@]}" --clobber
            exit 0
          fi

          previous="$(git describe --abbrev=0 --tags --match 'v*.*.*' HEAD~1 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            notes="$(git log --format='- %s' "${previous}..HEAD")"
          else
            notes="First release."
          fi

          # 🚧 A semver pre-release tag carries a hyphen after the version
          # triple (v0.2.0-rc.1). Such a build must not become the "Latest"
          # release that a download link resolves to.
          prerelease=()
          case "$version" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "$version" "${assets[@]}" \
            --title "Pingclair $version" \
            --notes "$notes" \
            "${prerelease[@]}"

  publish-image:
    name: Publish release image (${{ matrix.platform.name }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tag: amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.platform.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deployment/Dockerfile
          platforms: ${{ matrix.platform.platform }}
          push: true
          tags: |
            ghcr.io/dorianverlaine/pingclair:${{ needs.verify-tag.outputs.version }}-${{ matrix.platform.tag }}

      - name: Smoke the ${{ matrix.platform.name }} image
        run: |
          set -Eeuo pipefail
          image="ghcr.io/dorianverlaine/pingclair:${{ needs.verify-tag.outputs.version }}-${{ matrix.platform.tag }}"
          version_output="$(docker run --rm "$image" version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
          # 🔐 The example names a certificate and a key, and validation is
          # fail-closed about paths it cannot open, so the smoke run needs the
          # two files to exist. Empty stubs are enough: only their presence is
          # checked here.
          certs="$(mktemp -d)"
          touch "$certs/example.com.pem" "$certs/example.com.key"
          docker run --rm \
            -v "$PWD/examples:/examples:ro" \
            -v "$certs:/etc/pingclair/certs:ro" \
            "$image" validate /examples/full_featured.pingclair

  publish-image-manifest:
    name: Publish multi-arch release manifest
    needs: [publish-image, verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        run: |
          version="${{ needs.verify-tag.outputs.version }}"
          docker buildx imagetools create \
            -t ghcr.io/dorianverlaine/pingclair:"$version" \
            -t ghcr.io/dorianverlaine/pingclair:latest \
            ghcr.io/dorianverlaine/pingclair:"$version"-amd64 \
            ghcr.io/dorianverlaine/pingclair:"$version"-arm64

  publish-r2:
    name: Mirror to R2
    # 🧊 GitHub is where a release is created; R2 is where it is served from.
    # `always()` here is about the dispatch path above, where the job this needs
    # is skipped because there is nothing to build — the mirror still has to run.
    needs: [publish-release]
    if: ${{ always() && (github.event_name != 'push' || needs.publish-release.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 🔐 The publisher credential lives in an environment rather than in the
    # repository, so it is handed to exactly one job and can be reviewed there.
    environment: pingclair-r2-publisher
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      R2_RELEASES_ENDPOINT: ${{ secrets.R2_RELEASES_ENDPOINT }}
      R2_RELEASES_BUCKET: ${{ secrets.R2_RELEASES_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      # 🚦 R2 throttles parallel multipart uploads. The publisher parallelizes
      # across objects instead, and keeps each object's parts serial.
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure the transfer client for R2
        run: |
          set -euo pipefail
          aws configure set default.s3.preferred_transfer_client classic
          aws configure set default.s3.max_concurrent_requests 1

      - name: Mirror the release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_r2_release.py --tag "${RELEASE_TAG}" --stage finalize
