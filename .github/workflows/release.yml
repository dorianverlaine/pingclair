name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # 🎯 Verify the tag before anything is built. Modelled on caddy's
  # release.yml verify-tag job: a tag is the release contract, so the
  # tag name must match the version the workspace declares — publishing
  # a v0.2.0 artifact from a tree that still says 0.1.7 is the failure
  # this step exists to make impossible. nginx's check-version-bump.yaml
  # guards the same invariant from the other side (a version bump must
  # follow every release tag).
  # ============================================================
  verify-tag:
    name: Verify tag matches the workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version information
        id: info
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          crate_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          echo "crate_version=${crate_version}" >> "$GITHUB_OUTPUT"
          if [ "${tag#v}" != "${crate_version}" ]; then
            echo "::error::tag ${tag} does not match workspace version ${crate_version} — bump Cargo.toml before tagging"
            exit 1
          fi
          echo "✅ tag ${tag} matches workspace version ${crate_version}"

      - name: Verify the tag points at main
        # 🧭 A release tag on a side branch would ship code that never
        # passed the main CI gate; refuse it here rather than discover
        # it after publication. A tag push only checks out the tag ref,
        # so fetch main explicitly before comparing.
        run: |
          tag_sha="$(git rev-list -1 ${GITHUB_REF#refs/tags/})"
          git fetch --quiet origin main --depth=1
          main_sha="$(git rev-list -1 FETCH_HEAD)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} points at ${tag_sha}, but main is at ${main_sha}"
            exit 1
          fi
          echo "✅ tag points at the tip of main"

  # ============================================================
  # 🏗️ Build the release binaries natively per architecture, exactly
  # like the dev-binaries job — no cross toolchain, no QEMU, and the
  # smoke test executes the artifact it just built. The old workflow
  # cross-compiled aarch64 on an x86_64 runner and could never run the
  # resulting binary; a release artifact nobody has executed is not
  # verified.
  # ============================================================
  build-binaries:
    name: Build release binary (${{ matrix.platform.name }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: x86_64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: aarch64

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        # 🧱 boring-sys needs cmake + g++ for BoringSSL, clang/libclang-dev
        # for bindgen and perl for its scripts. Keep in sync with
        # deployment/Dockerfile, see docs/GUARDRAILS.md.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            perl \
            pkg-config \
            clang \
            libclang-dev \
            git \
            curl

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.platform.target }}

      - name: Smoke test the binary
        # 🏷️ The bare semver form printed by `version` since ca104ea.
        run: |
          binary="target/${{ matrix.platform.target }}/release/pingclair"
          version_output="$("$binary" version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
          "$binary" validate examples/full_featured.pingclair

      - name: Package and checksum
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar -czf pingclair-linux-${{ matrix.platform.key }}.tar.gz pingclair
          shasum -a 256 pingclair-linux-${{ matrix.platform.key }}.tar.gz > SHA256SUMS-${{ matrix.platform.key }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pingclair-linux-${{ matrix.platform.key }}
          path: |
            target/${{ matrix.platform.target }}/release/pingclair-linux-${{ matrix.platform.key }}.tar.gz
            target/${{ matrix.platform.target }}/release/SHA256SUMS-${{ matrix.platform.key }}.txt
          retention-days: 7

  # ============================================================
  # 📦 Publish the GitHub release with the verified binaries. Notes are
  # generated from commit subjects since the last tag — the same
  # discipline as the commit-subject check, so the changelog reads
  # cleanly.
  # ============================================================
  publish-release:
    name: Publish GitHub release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify the checksums
        # 🔒 A release page is a trust boundary: refuse to publish a
        # tarball whose checksum does not match what the build produced.
        run: |
          shasum -a 256 -c SHA256SUMS-x86_64.txt
          shasum -a 256 -c SHA256SUMS-aarch64.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.verify-tag.outputs.version }}"
          previous="$(git describe --abbrev=0 --tags --match 'v*.*.*' HEAD~1 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            notes="$(git log --format='- %s' "${previous}..HEAD")"
          else
            notes="First release."
          fi
          gh release create "$version" \
            pingclair-linux-x86_64.tar.gz \
            pingclair-linux-aarch64.tar.gz \
            SHA256SUMS-x86_64.txt \
            SHA256SUMS-aarch64.txt \
            --title "Pingclair $version" \
            --notes "$notes"

  # ============================================================
  # 🐳 Release image: build both architectures natively and merge them
  # into a multi-arch manifest tagged with the version and `latest`.
  # ============================================================
  publish-image:
    name: Publish release image (${{ matrix.platform.name }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            tag: amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.platform.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: ${{ matrix.platform.platform }}
          push: true
          tags: |
            ghcr.io/dorianverlaine/pingclair:${{ needs.verify-tag.outputs.version }}-${{ matrix.platform.tag }}

      - name: Smoke the ${{ matrix.platform.name }} image
        # 🧭 Runs the published per-architecture image natively on its own
        # runner, so each arch is verified before the manifest merge.
        run: |
          image="ghcr.io/dorianverlaine/pingclair:${{ needs.verify-tag.outputs.version }}-${{ matrix.platform.tag }}"
          version_output="$(docker run --rm "$image" version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
          docker run --rm -v "$PWD/examples:/examples:ro" \
            "$image" validate /examples/full_featured.pingclair

  publish-image-manifest:
    name: Publish multi-arch release manifest
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        run: |
          version="${{ needs.verify-tag.outputs.version }}"
          docker buildx imagetools create \
            -t ghcr.io/dorianverlaine/pingclair:"$version" \
            -t ghcr.io/dorianverlaine/pingclair:latest \
            ghcr.io/dorianverlaine/pingclair:"$version"-amd64 \
            ghcr.io/dorianverlaine/pingclair:"$version"-arm64
