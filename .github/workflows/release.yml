name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # 🪞 Mirrors an existing release into the R2 channel without cutting a new
  # tag: the recovery path when a mirror run fails after the release is already
  # published, and how an older release gets a channel pointer. Every other job
  # in this workflow builds from the tag that was pushed, so they are skipped
  # here.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror, for example v0.2.0-rc.3'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches the workspace version
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      make_latest: ${{ steps.info.outputs.make_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version information
        id: info
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # 🏷️ The shape rules and the prerelease/latest decision live in one
          # tested script, so this workflow and scripts/cut-release.sh cannot
          # disagree about what a tag means.
          if [ "$tag" = "$version" ] || ! python3 scripts/release/versions.py check "$version"; then
            echo "::error::tag ${tag} is not a release tag (vX.Y.Z, vX.Y.Z-alpha.N[.M], vX.Y.Z-beta.N or vX.Y.Z-rc.N)"
            exit 1
          fi
          crate_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          if [ "${version}" != "${crate_version}" ]; then
            echo "::error::tag ${tag} does not match workspace version ${crate_version} at the tagged commit — cut releases with scripts/cut-release.sh"
            exit 1
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          python3 scripts/release/versions.py github-flags "$version" >> "$GITHUB_OUTPUT"
          echo "🏷️ tag ${tag} matches workspace version ${crate_version}"

      - name: Verify the release commit sits on a reviewed branch
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # 📌 main always says 0.0.0, so a release commit is never on main:
          # it is one commit on top of it that only sets the version. What
          # must be reviewed is therefore its parent — on main, or on a
          # release/X.Y branch for a patch to an older stable line.
          changed="$(git diff --name-only "${tag}^" "${tag}" | sort | tr '\n' ' ')"
          if [ "$changed" != "Cargo.lock Cargo.toml " ]; then
            echo "::error::a release commit changes only Cargo.toml and Cargo.lock, but ${tag} changes: ${changed}"
            exit 1
          fi
          line="$(echo "$version" | cut -d- -f1 | cut -d. -f1-2)"
          git fetch --quiet origin main
          git fetch --quiet origin "+refs/heads/release/${line}:refs/remotes/origin/release/${line}" 2>/dev/null || true
          for base in origin/main "origin/release/${line}"; do
            if git rev-parse --verify --quiet "$base" >/dev/null \
              && git merge-base --is-ancestor "${tag}^" "$base"; then
              echo "🏷️ ${tag} is one version commit on top of ${base}"
              exit 0
            fi
          done
          echo "::error::the parent of ${tag} is on neither origin/main nor origin/release/${line}"
          exit 1

  build-binaries:
    name: Build release binary (${{ matrix.platform.name }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/dorianverlaine/pingclair-builder:v1
    defaults:
      run:
        shell: bash
        working-directory: /workspace/pingclair
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            key: x86_64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Place the checkout at the image's workspace path
        run: |
          set -euo pipefail
          cp -a --no-preserve=ownership "${GITHUB_WORKSPACE}/." /workspace/pingclair/

      - uses: ./.github/actions/setup-ci

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.platform.target }}
          profile: release
          cache-scope: release-binaries
          cargo-home: /usr/local/cargo
          r2-endpoint: ${{ vars.R2_CACHE_ENDPOINT }}
          r2-bucket: ${{ vars.R2_CACHE_BUCKET }}
          r2-access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}

      - name: Build the release binary
        run: cargo +1.98.1 build --release --locked --target ${{ matrix.platform.target }}

      - name: Smoke test the binary
        run: |
          binary="${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release/pingclair"
          version_output="$("$binary" version)"
          echo "$version_output"
          # 🏷️ A release binary names exactly its tag. Anything else, such as a
          # `v0.0.0-dev+<sha>`, means the build never saw the release commit.
          if [ "$version_output" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::binary reports ${version_output}, expected ${GITHUB_REF_NAME}"
            exit 1
          fi
          sudo mkdir -p /etc/pingclair/certs
          sudo touch /etc/pingclair/certs/example.com.pem /etc/pingclair/certs/example.com.key
          "$binary" validate examples/full_featured.pingclair

      - name: Package and checksum
        run: |
          cd "${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release"
          tar -czf pingclair-linux-${{ matrix.platform.key }}.tar.gz pingclair
          shasum -a 256 pingclair-linux-${{ matrix.platform.key }}.tar.gz > SHA256SUMS-${{ matrix.platform.key }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pingclair-linux-${{ matrix.platform.key }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.platform.target }}/release/pingclair-linux-${{ matrix.platform.key }}.tar.gz
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.platform.target }}/release/SHA256SUMS-${{ matrix.platform.key }}.txt
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: [build-binaries, verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Verify the checksums
        run: |
          shasum -a 256 -c SHA256SUMS-x86_64.txt
          shasum -a 256 -c SHA256SUMS-aarch64.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          version="${{ needs.verify-tag.outputs.version }}"
          assets=(
            pingclair-linux-x86_64.tar.gz
            pingclair-linux-aarch64.tar.gz
            SHA256SUMS-x86_64.txt
            SHA256SUMS-aarch64.txt
          )

          # 🚧 Every suffixed version is a prerelease and never "Latest", so a
          # link that resolves the latest release only ever reaches a stable
          # build. versions.py made both decisions in verify-tag.
          flags=(
            "--prerelease=${{ needs.verify-tag.outputs.prerelease }}"
            "--latest=${{ needs.verify-tag.outputs.make_latest }}"
          )

          # 📝 A release worth announcing is written by hand before the tag is
          # pushed, and this job must not destroy those notes or fail because
          # they exist. So: attach the binaries to whatever is already there,
          # and only write a release when nobody did.
          if gh release view "$version" >/dev/null 2>&1; then
            echo "📎 Release $version already exists — attaching binaries to it."
            gh release upload "$version" "${assets[@]}" --clobber
            gh release edit "$version" "${flags[@]}"
            exit 0
          fi

          # 📝 The annotated tag's message is the CHANGELOG's Unreleased
          # section, written into it by scripts/cut-release.sh. A commit log
          # would not work here: earlier release commits are off main, so no
          # previous tag is an ancestor of this one.
          gh release create "$version" "${assets[@]}" \
            --title "Pingclair $version" \
            --notes-from-tag \
            "${flags[@]}"

  publish-image:
    name: Publish release image (${{ matrix.platform.name }})
    needs: verify-tag
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tag: amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.platform.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deployment/Dockerfile
          platforms: ${{ matrix.platform.platform }}
          push: true
          tags: |
            ghcr.io/dorianverlaine/pingclair:${{ needs.verify-tag.outputs.version }}-${{ matrix.platform.tag }}

      - name: Smoke the ${{ matrix.platform.name }} image
        run: |
          set -Eeuo pipefail
          image="ghcr.io/dorianverlaine/pingclair:${{ needs.verify-tag.outputs.version }}-${{ matrix.platform.tag }}"
          version_output="$(docker run --rm "$image" version)"
          echo "$version_output"
          if [ "$version_output" != "${{ needs.verify-tag.outputs.version }}" ]; then
            echo "::error::image reports ${version_output}, expected ${{ needs.verify-tag.outputs.version }}"
            exit 1
          fi
          # 🔐 The example names a certificate and a key, and validation is
          # fail-closed about paths it cannot open, so the smoke run needs the
          # two files to exist. Empty stubs are enough: only their presence is
          # checked here.
          certs="$(mktemp -d)"
          touch "$certs/example.com.pem" "$certs/example.com.key"
          docker run --rm \
            -v "$PWD/examples:/examples:ro" \
            -v "$certs:/etc/pingclair/certs:ro" \
            "$image" validate /examples/full_featured.pingclair

  publish-image-manifest:
    name: Publish multi-arch release manifest
    needs: [publish-image, verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        run: |
          set -Eeuo pipefail
          version="${{ needs.verify-tag.outputs.version }}"
          # 🚧 `:latest` follows the GitHub release: only a stable version
          # moves it, so a plain `docker pull` never lands on a preview.
          tags=(-t ghcr.io/dorianverlaine/pingclair:"$version")
          if [ "${{ needs.verify-tag.outputs.make_latest }}" = "true" ]; then
            tags+=(-t ghcr.io/dorianverlaine/pingclair:latest)
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            ghcr.io/dorianverlaine/pingclair:"$version"-amd64 \
            ghcr.io/dorianverlaine/pingclair:"$version"-arm64

  publish-r2:
    name: Mirror to R2
    # 🧊 GitHub is where a release is created; R2 is where it is served from.
    # `always()` here is about the dispatch path above, where the job this needs
    # is skipped because there is nothing to build — the mirror still has to run.
    needs: [publish-release]
    if: ${{ always() && (github.event_name != 'push' || needs.publish-release.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 🔐 The publisher credential lives in an environment rather than in the
    # repository, so it is handed to exactly one job and can be reviewed there.
    environment: pingclair-r2-publisher
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      R2_RELEASES_ENDPOINT: ${{ secrets.R2_RELEASES_ENDPOINT }}
      R2_RELEASES_BUCKET: ${{ secrets.R2_RELEASES_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      # 🚦 R2 throttles parallel multipart uploads. The publisher parallelizes
      # across objects instead, and keeps each object's parts serial.
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure the transfer client for R2
        run: |
          set -euo pipefail
          aws configure set default.s3.preferred_transfer_client classic
          aws configure set default.s3.max_concurrent_requests 1

      - name: Mirror the release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_r2_release.py --tag "${RELEASE_TAG}" --stage finalize
