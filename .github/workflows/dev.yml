name: Dev builds

# 🧪 Per-push development artifacts, gated on the full post-merge suite so a
# red full run never ships a dev snapshot.
on:
  workflow_run:
    workflows: ["Postmerge CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: dev-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dev-binaries:
    name: Dev binaries - ${{ matrix.platform.name }}
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            key: x86_64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: aarch64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-linux-deps

      - uses: ./.github/actions/setup-ci

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.platform.target }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ matrix.platform.target }}
          profile: release
          cache-scope: dev-binaries

      - name: Build
        run: cargo +1.97.1 build --release --locked --target ${{ matrix.platform.target }}

      - name: Smoke test the binary
        run: |
          binary="${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release/pingclair"
          version_output="$("$binary" version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
          sudo mkdir -p /etc/pingclair/certs
          sudo touch /etc/pingclair/certs/example.com.pem /etc/pingclair/certs/example.com.key
          "$binary" validate examples/full_featured.pingclair

      - name: Package and checksum
        run: |
          cd "${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release"
          tar -czf pingclair-linux-${{ matrix.platform.key }}-dev.tar.gz pingclair
          shasum -a 256 pingclair-linux-${{ matrix.platform.key }}-dev.tar.gz > SHA256SUMS-dev-${{ matrix.platform.key }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pingclair-linux-${{ matrix.platform.key }}-dev
          path: |
            ${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release/pingclair-linux-${{ matrix.platform.key }}-dev.tar.gz
            ${CARGO_TARGET_DIR}/${{ matrix.platform.target }}/release/SHA256SUMS-dev-${{ matrix.platform.key }}.txt
          retention-days: 14

  publish-dev-release:
    name: Publish rolling dev release
    needs: dev-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download dev binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Verify the checksums
        run: |
          shasum -a 256 -c SHA256SUMS-dev-x86_64.txt
          shasum -a 256 -c SHA256SUMS-dev-aarch64.txt

      - name: Write the release notes
        run: |
          {
            echo "Snapshot of \`main\` at [\`${{ github.event.workflow_run.head_sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}), built by [CI run #${{ github.event.workflow_run.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})."
            echo
            echo "**Not a stable release.** The \`dev\` tag is a moving target: it is force-replaced on every push while the project is in rapid iteration, so the binary you install today will not be the same one you install next week."
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sudo bash -s -- --dev'
            echo '```'
            echo
            echo "## Assets"
            for asset in pingclair-linux-*-dev.tar.gz SHA256SUMS-dev-*.txt; do
              printf -- '- %s\n' "$asset"
            done
          } > /tmp/dev-release-notes.md

      - name: Replace the rolling dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes --cleanup-tag
          fi
          gh release create dev \
            pingclair-linux-x86_64-dev.tar.gz \
            pingclair-linux-aarch64-dev.tar.gz \
            SHA256SUMS-dev-x86_64.txt \
            SHA256SUMS-dev-aarch64.txt \
            --title "Development builds (unstable)" \
            --notes-file /tmp/dev-release-notes.md

  publish-dev-image:
    name: Publish dev image (${{ matrix.platform.name }})
    needs: dev-binaries
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tag: amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.platform.name }} image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deployment/Dockerfile
          platforms: ${{ matrix.platform.platform }}
          push: true
          tags: |
            ghcr.io/dorianverlaine/pingclair:dev-${{ matrix.platform.tag }}

      - name: Smoke the ${{ matrix.platform.name }} image
        run: |
          set -Eeuo pipefail
          image="ghcr.io/dorianverlaine/pingclair:dev-${{ matrix.platform.tag }}"
          version_output="$(docker run --rm "$image" version)"
          echo "$version_output"
          echo "$version_output" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
          certs="$(mktemp -d)"
          touch "$certs/example.com.pem" "$certs/example.com.key"
          docker run --rm \
            -v "$PWD/examples:/examples:ro" \
            -v "$certs:/etc/pingclair/certs:ro" \
            "$image" validate /examples/full_featured.pingclair

  publish-dev-manifest:
    name: Publish multi-arch dev manifest
    needs: publish-dev-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/dorianverlaine/pingclair:dev \
            -t ghcr.io/dorianverlaine/pingclair:${{ github.event.workflow_run.head_sha }} \
            ghcr.io/dorianverlaine/pingclair:dev-amd64 \
            ghcr.io/dorianverlaine/pingclair:dev-arm64
