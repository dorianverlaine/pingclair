name: Blocking CI

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: blocking-ci-${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  # 🧊 The builder image publishes — or proves current — the Linux build
  # environment before the container jobs pull `:v1`, so a toolchain bump
  # cannot race its own consumers (#300).
  builder:
    name: Builder image
    # 🔐 The called workflow's build and manifest jobs push to GHCR, and the
    # caller's permissions are their ceiling. Nothing publishes on a pull
    # request — the gate keeps `:v1` where it is — so the grant is inert there.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/builder-image.yml

  # Reusable children are kept alphabetized; the `required` job is the single
  # status the main-branch ruleset should require.
  rust-ci:
    name: Rust CI
    needs: builder
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  docker:
    name: Docker
    needs: builder
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  commit-checks:
    name: Commit checks
    uses: ./.github/workflows/commit-checks.yml
    secrets: inherit

  security-audit:
    name: Security audit
    uses: ./.github/workflows/security-audit.yml
    secrets: inherit

  cargo-deny:
    name: Cargo deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  repo-checks:
    name: Repo checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  docs-lint:
    name: Docs lint
    uses: ./.github/workflows/docs-lint.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - rust-ci
      - docker
      - commit-checks
      - security-audit
      - cargo-deny
      - repo-checks
      - codespell
      - docs-lint
      - blob-size-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
