name: Rust CI full

on:
  workflow_call:
  push:
    branches: ["**full-ci**"]
  workflow_dispatch:

concurrency:
  group: rust-ci-full-${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  lint-release:
    name: Clippy (release profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/dorianverlaine/pingclair-builder:v1
    defaults:
      run:
        shell: bash
        working-directory: /workspace/pingclair
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Place the checkout at the image's workspace path
        run: |
          set -euo pipefail
          cp -a "${GITHUB_WORKSPACE}/." /workspace/pingclair/

      - uses: ./.github/actions/setup-ci

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          profile: release
          cache-scope: rust-ci-full
          cargo-home: /usr/local/cargo
          r2-endpoint: ${{ vars.R2_CACHE_ENDPOINT }}
          r2-bucket: ${{ vars.R2_CACHE_BUCKET }}
          r2-access-key-id: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}

      - name: Check formatting
        run: cargo +1.98.1 fmt --all -- --check

      - name: Run Clippy with the release profile
        run: cargo +1.98.1 clippy --locked --workspace --all-targets --profile release -- -D warnings

      - uses: ./.github/actions/check-clean-worktree
        with:
          worktree: /workspace/pingclair

  tests_x86_64:
    name: Tests — Linux x86_64
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-x64
    secrets: inherit

  tests_aarch64:
    name: Tests — Linux aarch64
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-arm64
    secrets: inherit

  results:
    name: Full CI results
    needs: [lint-release, tests_x86_64, tests_aarch64]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
