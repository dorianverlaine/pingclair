name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # 🧹 Fast checks that must never mask a test failure.
  # ============================================================
  # Designed after caddy's lint.yml: before 2026-08-02, fmt/clippy ran
  # as steps inside the test job, so a clippy failure skipped build and
  # tests entirely — a Linux-only needless_return stayed red for two
  # pushes and the reload test that had never once run in CI stayed
  # invisible behind it. This workflow runs in parallel with ci.yml, so
  # one red does not hide the other.
  lint:
    name: Lint (fmt, clippy, shell, BoringSSL invariant)
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        # 🧱 clippy compiles every dependency, including boring-sys, so
        # this job needs the same cmake/clang/libclang toolchain as test.
        # Keep this list in sync with deployment/Dockerfile (see
        # docs/guardrails/testing.md — the two drifted once and the production
        # image was never built again until CI caught it).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            make \
            g++ \
            perl \
            pkg-config \
            clang \
            libclang-dev \
            git \
            curl \
            ca-certificates

      - uses: actions/checkout@v5

      - name: Install Rust 1.97
        # 🧰 dtolnay's action defaults to the minimal profile — no rustfmt,
        # no clippy — so the components this job actually runs must be named
        # explicitly. The old monolithic workflow's fmt/clippy steps only
        # passed because they lived in the test job, which installed via
        # rustup's default profile; moving them here surfaced the gap on the
        # first run of this workflow.
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-

      - name: Check shell syntax
        run: bash -n scripts/*.sh benchmarks/scripts/*.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Verify the single-BoringSSL invariant
        # 🔐 quiche only runs on BoringSSL and pingora-core defaults to
        # OpenSSL; the two collide on libcrypto symbols at link time (has
        # crashed the binary at startup before). This is the same check
        # docs/guardrails/tls.md asks a human to run by hand — it belongs in CI
        # instead, where a stray `pingora-openssl` or `openssl-sys` dependency fails
        # the build instead of waiting to be noticed. It lives in lint
        # rather than ci because `cargo tree` only needs the lockfile.
        run: |
          if cargo tree -i openssl-sys > /tmp/openssl-sys-tree.txt 2>/dev/null; then
            echo "::error::openssl-sys is present in the dependency tree — this must stay BoringSSL-only:"
            cat /tmp/openssl-sys-tree.txt
            exit 1
          fi
          echo "✅ no openssl-sys in the dependency tree"

      - name: Verify the h2 performance fork is wired
        # ⚡ h2 is patched through `[patch.crates-io]` with a per-connection
        # HPACK scratch buffer. A Pingora upgrade that moves to a newer h2
        # version would silently drop the fork (build stays green), so the
        # resolution is checked here the same way the BoringSSL invariant is.
        run: scripts/check-vendored-h2.sh
