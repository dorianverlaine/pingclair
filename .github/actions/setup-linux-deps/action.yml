name: setup-linux-deps
description: Install the pinned Linux build dependencies with a resilient apt mirror configuration.

runs:
  using: composite
  steps:
    - name: Pin apt to the global Ubuntu archive
      shell: bash
      run: |
        set -euo pipefail
        # 🧭 GitHub-hosted runners resolve azure.archive.ubuntu.com through a
        # mirrorlist, and that mirror has repeatedly hung or crawled for
        # minutes. Pin every source directly to the global archive.ubuntu.com
        # CDN, and rewrite the mirrorlist too in case something re-reads it.
        if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
          sudo sed -i 's|^URIs:.*|URIs: http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
        fi
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
        fi

    - name: Update apt with a hard deadline and IPv4
      shell: bash
      run: |
        set -euo pipefail
        # 🛡️ A hanging mirror must not stall the whole job. The hosted image
        # ships current package lists, so a failed update is a warning, not a
        # stop condition: installation below falls back to those lists.
        if ! timeout 120 sudo apt-get update \
          -o Acquire::ForceIPv4=true \
          -o Acquire::Retries=2 \
          -o Acquire::http::Timeout=30 \
          -o Acquire::https::Timeout=30; then
          echo "::warning::apt-get update failed or timed out; installing from the runner's existing package lists"
        fi

    - name: Install build dependencies
      shell: bash
      run: |
        timeout 600 sudo apt-get install -y --no-install-recommends \
          -o Acquire::ForceIPv4=true \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=60 \
          -o Acquire::https::Timeout=60 \
          cmake make g++ perl pkg-config clang libclang-dev git curl ca-certificates
