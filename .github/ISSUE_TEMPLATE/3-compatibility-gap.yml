name: 🧩 Caddy compatibility gap
description: A Caddyfile that works with Caddy and does not work here
title: "🧩 "
labels:
  - 🧩 compatibility
  - 🔬 needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Pingclair aims to run a Caddyfile unchanged, so **a config Caddy accepts
        and Pingclair rejects is our bug**, not your feature request. You do not
        have to talk us into it.

        🤡 One thing worth checking first, learned the embarrassing way: does
        the reference implementation *actually* do what you think? Our own
        records once claimed a difference upstream turned out not to have, and
        "fixing" it would have manufactured an incompatibility from scratch.
        `caddy adapt` settles it in about four seconds and saves everyone the
        archaeology.

  - type: textarea
    id: config
    attributes:
      label: 📄 The configuration
      description: The directive or block, trimmed as far as it goes while still showing the difference.
      render: Caddyfile
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: 🟢 What Caddy does
      description: Output of `caddy adapt`, or the actual response for a runtime difference. **Name the Caddy version** — behaviour moves between releases, and an unversioned claim is unfalsifiable six months from now.
      placeholder: |
        caddy v2.11.4
        $ caddy adapt --config Caddyfile
        ...
    validations:
      required: true

  - type: textarea
    id: pingclair
    attributes:
      label: 🔴 What Pingclair does
      description: The error, or the differing output. `pingclair adapt` is the same command on our side.
      placeholder: |
        $ pingclair adapt -c Pingclairfile
        ...
    validations:
      required: true

  - type: dropdown
    id: failure-mode
    attributes:
      label: 💣 How does it fail?
      description: This matters more than it looks. A loud rejection is merely irritating; quietly doing something else is the one that ends up in a postmortem, because the operator never finds out.
      options:
        - Rejected at load time, with an error
        - Accepted, then behaves differently at runtime
        - Accepted, then silently does nothing
    validations:
      required: true

  - type: input
    id: assistance
    attributes:
      label: 🤖 Which AI helped?
      description: 'Encouraged, not merely tolerated — we just want the model name so review can be calibrated. "Claude Opus 5 diffed the two adapt outputs" is a perfect answer. So is "none".'
      placeholder: none
    validations:
      required: true
