worker_processes 1;
pid /root/bench/backend.pid;
error_log /root/bench/backend_error.log;

events {
    worker_connections 1024;
}

http {
    access_log off;

    server {
        listen 127.0.0.1:9000;

        location / {
            default_type application/json;
            return 200 '{"ok":true,"backend":"shared-upstream"}';
        }
    }
}
