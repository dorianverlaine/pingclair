worker_processes auto;
pid /root/bench/nginx_under_test.pid;
error_log /root/bench/nginx_under_test_error.log;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log off;
    sendfile on;

    gzip on;
    gzip_types text/plain text/html application/json;
    gzip_min_length 256;
    gzip_comp_level 1;

    server {
        listen 0.0.0.0:8080;
        server_name bench.local;
        root /root/bench/html;

        location /proxy/ {
            proxy_pass http://127.0.0.1:9000/;
        }

        location / {
            try_files $uri =404;
        }
    }
}
