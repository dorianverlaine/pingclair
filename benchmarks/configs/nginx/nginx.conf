worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log off;
    sendfile on;

    gzip on;
    gzip_types text/plain text/html application/json;
    gzip_min_length 256;
    # level 1 to roughly match pingclair-proxy's Compression::fast() for
    # the reverse-proxy gzip path; see benchmarks/README.md for the caveat
    # that engines' static-file gzip paths use their own defaults.
    gzip_comp_level 1;

    server {
        listen 8080;
        server_name bench.local;
        root /var/www/html;

        location /proxy/ {
            proxy_pass http://backend:9000/;
        }

        location / {
            try_files $uri =404;
        }
    }
}
