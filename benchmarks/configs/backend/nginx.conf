# Shared, unmeasured upstream used by all three reverse-proxy tests.
# Returns a tiny fixed response instantly (no filesystem I/O) so the
# proxy layer being benchmarked is the bottleneck, not this backend.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    server {
        listen 9000 default_server;

        location / {
            default_type application/json;
            return 200 '{"ok":true,"backend":"shared-upstream"}';
        }
    }
}
