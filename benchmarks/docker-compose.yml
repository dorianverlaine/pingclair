name: pingclair-bench

networks:
  bench:
    driver: bridge

services:
  backend:
    image: nginx:1.27-alpine
    networks: [bench]
    volumes:
      - ./configs/backend/nginx.conf:/etc/nginx/nginx.conf:ro
    # Not published to the host — internal-only shared upstream.

  pingclair:
    build:
      context: ..
      # 🐳 The one Dockerfile. There used to be a second copy at the repository
      # root that nothing built and that had drifted into being unbuildable —
      # see the 2026-08-05 entry in docs/guardrails/testing.md.
      dockerfile: deployment/Dockerfile
    command: ["pingclair", "run", "/etc/pingclair/Pingclairfile"]
    networks: [bench]
    depends_on: [backend]
    volumes:
      - ./configs/pingclair/Pingclairfile:/etc/pingclair/Pingclairfile:ro
      - ./payloads:/var/www/html:ro
    ports:
      - "18080:8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    networks: [bench]
    depends_on: [backend]
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./payloads:/var/www/html:ro
    ports:
      - "18081:8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  caddy:
    image: caddy:2-alpine
    networks: [bench]
    depends_on: [backend]
    volumes:
      - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./payloads:/var/www/html:ro
    ports:
      - "18082:8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
