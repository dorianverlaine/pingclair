worker_processes 2;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_requests 1000000;

    upstream bench_backend {
        server 127.0.0.1:9000;
        keepalive 512;
    }

    server {
        listen 8080;
        server_name bench.local;
        root /var/www/html;

        location /proxy/ {
            proxy_pass http://bench_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            try_files $uri =404;
        }
    }

    server {
        listen 8443 ssl;
        listen 8443 quic reuseport;
        http2 on;
        server_name h3.local;
        root /var/www/html;
        ssl_certificate /tmp/bench.crt;
        ssl_certificate_key /tmp/bench.key;
        ssl_protocols TLSv1.3;
        ssl_early_data off;
        quic_retry off;
        quic_gso on;

        location /proxy/ {
            proxy_pass http://bench_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            try_files $uri =404;
        }
    }
}
