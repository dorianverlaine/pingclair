[package]
name = "pingclair"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A modern, high-performance web server built on Pingora"

[[bin]]
name = "pingclair"
path = "src/main.rs"

[dependencies]
pingclair-core = { path = "../pingclair-core" }
pingclair-config = { path = "../pingclair-config" }
pingclair-proxy = { path = "../pingclair-proxy" }
pingclair-static = { path = "../pingclair-static" }
pingclair-tls = { path = "../pingclair-tls" }
pingclair-api = { path = "../pingclair-api" }
pingclair-plugin = { path = "../pingclair-plugin" }

# Single TLS stack: BoringSSL everywhere. quiche (HTTP/3) links BoringSSL
# statically, so Pingora must use its boringssl backend — a second, OpenSSL
# TLS stack in the same binary collides on libcrypto symbols (SIGBUS).
pingora = { workspace = true, features = ["proxy", "boringssl"] }
boring.workspace = true

pingora-core = { workspace = true, features = ["connection_filter"] }
pingora-proxy.workspace = true
rustls.workspace = true

clap.workspace = true
async-trait.workspace = true

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true
bcrypt.workspace = true
parking_lot = "0.12"
futures = "0.3"


[target.'cfg(unix)'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
# default-features = false: reqwest's default-tls (native-tls) pulls in
# openssl-sys on Linux, whose OpenSSL symbols collide with quiche's statically
# linked BoringSSL at link time (undefined SSL_CTX_ctrl etc. in CI). rustls is
# pure Rust and has no C symbols, so it coexists with BoringSSL.
#
# `http2` is bundled into reqwest's own `default` feature set (unlike 0.11,
# where HTTP/2 came for free with hyper 0.14), so turning `default-features`
# off drops it too unless named here — the test suite drives h2/h2c requests
# through `http2_prior_knowledge()`, which does not compile without it.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "http2"] }
tokio = { workspace = true, features = ["full"] }
tempfile = "3.8"
uuid = { version = "1.0", features = ["v4"] }
flate2 = "1.0"
libc.workspace = true
h2.workspace = true
rcgen.workspace = true
bytes.workspace = true
http.workspace = true
