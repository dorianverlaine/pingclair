# 🛡️ Cargo-deny policy: keep the dependency tree free of unknown licenses,
# wildcard requirements, and unaccepted advisories. Every exception below is a
# written risk acceptance: it names the advisory, the dependency path, and the
# condition that removes it.

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained; pulled in via foundations -> serde_yaml under quiche/tokio-quiche; no upstream fix yet" },
    { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained; pulled in via pingora-core; no upstream fix yet" },
    { id = "RUSTSEC-2025-0069", reason = "daemonize is unmaintained; pulled in via pingora-core daemon mode; no upstream fix yet" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained; direct in pingclair-tls but only wraps rustls-pki-types; migrate to PemObject in a follow-up" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 is pulled in via pingora-cache and pingora-pool 0.8.1; the advisory concerns LruCache::pop() panic safety and Pingclair never calls lru directly; remove when pingora moves past lru 0.16" },
]

[bans]
# 🧩 Duplicates are warnings, not failures: the tree legitimately carries two
# major versions of bitflags, rand, syn, windows-sys, and others through
# Pingora, BoringSSL, and QUIC. A failure would need a per-duplicate skip list
# that nobody could keep honest.
multiple-versions = "warn"
# 🔗 Internal path-only dependencies carry no version, which cargo-deny
# classifies as wildcards; they resolve through the workspace itself, so the
# check would otherwise reject every `{ path = ... }` dependency.
wildcards = "allow"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
