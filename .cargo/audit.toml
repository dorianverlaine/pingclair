# 🔒 `cargo audit` exceptions — each entry here is a written risk acceptance
# (the Day 30 rule from the retired local ledger, docs/STATUS.md), not a
# silent suppression. An ignored ID
# below must name the dependency chain, why it is currently out of our hands,
# and what reachability we have actually checked — "vendored, therefore
# irrelevant" is exactly the kind of unverified claim this repository has
# learned not to make (see docs/GUARDRAILS.md on rejection notes).
#
# Anything fixable in a normal dependency bump belongs in Cargo.toml, not
# here. `reqwest` 0.11 → 0.12 (2026-07-31) removed three of these findings
# outright; this file holds only what a version bump could not touch.

[advisories]
ignore = [
    # protobuf 2.28.0 — RUSTSEC-2024-0437 (uncontrolled recursion, DoS on
    # decode). Reaches us via `prometheus 0.13` → `pingora-core 0.8.1`
    # (pingora-core pins `prometheus = "0.13"` with default features, which
    # includes `protobuf`). `pingora-core` is exact-pinned across this repo
    # for the BoringSSL/H3 reasons in GUARDRAILS, so we cannot bump past it
    # alone. `pingclair_proxy::metrics::gather()` only ever calls
    # prometheus's `TextEncoder` — nothing in this codebase decodes a
    # protobuf-format metrics payload from any input, trusted or not — so the
    # vulnerable recursion has no path from a request to reach it. That is a
    # reachability check on our own call sites, not a claim about what
    # `pingora-core` itself does internally, which has not been audited here.
    "RUSTSEC-2024-0437",

    # daemonize 0.5.0 — RUSTSEC-2025-0069 (unmaintained, no CVE). Direct
    # dependency of `pingora-core 0.8.1`, same exact-pin constraint as above.
    "RUSTSEC-2025-0069",

    # derivative 2.2.0 — RUSTSEC-2024-0388 (unmaintained, no CVE). Same:
    # `pingora-core 0.8.1`'s own dependency, not ours to swap out.
    "RUSTSEC-2024-0388",

    # yaml-rust 0.4.5 — RUSTSEC-2024-0320 (unmaintained, no CVE). Reaches us
    # via `serde_yaml 0.8` → `foundations` → `qlog` → `quiche`/`tokio-quiche`
    # — the same tracing dependency chain already documented in docs/TODO.md
    # (the tokio-quiche H3 migration pulls in `cf-rustracing` whether or not
    # tracing is ever enabled). `tokio-quiche` is exact-pinned per GUARDRAILS.
    "RUSTSEC-2024-0320",

    # rustls-pemfile 2.2.0 — RUSTSEC-2025-0134 (unmaintained, no CVE). This
    # one IS ours: a direct dependency of `pingclair-tls`, used for
    # `rustls_pemfile::certs`/`private_key` in manager.rs. Not fixed today —
    # this was a CI-fix session, not a dependency-audit sweep — but it is the
    # one entry here we could actually remove ourselves, most likely by
    # reading PEM material through `rustls-pki-types`'s iterator directly.
    # Real follow-up, not a permanent exception; tracked in the local
    # docs/TODO.md rather than left only in this comment.
    "RUSTSEC-2025-0134",
]
