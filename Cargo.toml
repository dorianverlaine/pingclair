[workspace]
resolver = "2"
members = [
    "pingclair",
    "pingclair-core",
    "pingclair-proxy",
    "pingclair-static",
    "pingclair-tls",
    "pingclair-config",
    "pingclair-api",
    "pingclair-plugin",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
authors = ["Dorian Verlaine <dorianverlaine@icloud.com>"]
license = "Apache-2.0"
repository = "https://github.com/dorianverlaine/pingclair"
rust-version = "1.88"

[workspace.dependencies]
# Pingora core
pingora = "0.8"
pingora-core = "0.8"
pingora-proxy = "0.8"
pingora-http = "0.8"
pingora-timeout = "0.8"
pingora-load-balancing = "0.8"
pingora-limits = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Configuration parsing
logos = "0.16"
ariadne = "0.6"      # error reporting

# TLS / certificates
rustls = { version = "0.23", features = ["ring"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"

# HTTP/3 (QUIC) — Cloudflare quiche on BoringSSL, with a hand-written event
# loop in `pingclair-proxy/src/quic.rs`.
#
# ⚠️ The note that used to sit here — "tokio-quiche was evaluated and rejected:
# its server-side accept API is pub(crate)" — was WRONG, and it was wrong in the
# way a rejection note is most harmful: it stopped anyone re-examining the
# question. Only the internal `quic::start_listener()` is `pub(crate)`. The
# facade is public, verified against `tokio-quiche 0.19.1` on 2026-07-30:
# `tokio_quiche::listen()` (lib.rs:191), plus `ServerH3Driver`,
# `ServerH3Controller`, `InitialQuicConnection` and `ApplicationOverQuic`.
#
# The dependency versions align exactly — it pulls `quiche 0.29.3` and
# `boring 4.22.0`, the same ones below, with no `openssl-sys` anywhere — so the
# single-BoringSSL invariant survives the migration. Replacing the hand-written
# loop is therefore viable and scheduled; see `docs/TODO.md`.
quiche = "0.29"
boring = "4.22"   # must stay on the same release quiche 0.29 links against

# HTTP
http = "1"
bytes = "1"
h2 = "0.4"
mime_guess = "2"
ipnet = "2"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.14"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
criterion = "0.8"

# File system
dirs = "6"

# String handling
smartstring = "1"

# 🔐 Password hashing support.
bcrypt = "0.19"

# Lock-free reads on hot paths
arc-swap = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
