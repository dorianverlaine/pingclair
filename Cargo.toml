[workspace]
resolver = "2"
members = [
    "pingclair",
    "pingclair-core",
    "pingclair-proxy",
    "pingclair-static",
    "pingclair-tls",
    "pingclair-config",
    "pingclair-api",
    "pingclair-plugin",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
authors = ["Dorian Verlaine <dorianverlaine@icloud.com>"]
license = "Apache-2.0"
repository = "https://github.com/dorianverlaine/pingclair"
rust-version = "1.88"

[workspace.dependencies]
# Pingora 核心
pingora = "0.8"
pingora-core = "0.8"
pingora-proxy = "0.8"
pingora-http = "0.8"
pingora-timeout = "0.8"
pingora-load-balancing = "0.8"
pingora-limits = "0.8"

# Async 运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# 配置解析
logos = "0.16"
ariadne = "0.6"      # 错误报告

# TLS/证书
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.14"
x509-parser = "0.18"

# HTTP/3 (QUIC) — Cloudflare quiche on BoringSSL
# (tokio-quiche was evaluated and rejected: its server-side accept API is
# pub(crate); the raw quiche event loop is implemented in pingclair-proxy.)
quiche = "0.29"
boring = "4.22"   # must stay on the same release quiche 0.29 links against

# HTTP
http = "1"
bytes = "1"
mime_guess = "2"

# 日志和监控
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.14"

# 错误处理
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# 测试
criterion = "0.8"

# 文件系统
dirs = "6"

# 字符串处理
smartstring = "1"

# 无锁热路径读取
arc-swap = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

