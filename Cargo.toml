[workspace]
resolver = "2"
members = [
    "pingclair",
    "pingclair-core",
    "pingclair-proxy",
    "pingclair-static",
    "pingclair-tls",
    "pingclair-config",
    "pingclair-api",
    "pingclair-plugin",
]
exclude = ["vendor/h2"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
authors = ["Dorian Verlaine <dorianverlaine@icloud.com>"]
license = "Apache-2.0"
repository = "https://github.com/dorianverlaine/pingclair"
rust-version = "1.97"

[workspace.dependencies]
# Pingora core
pingora = "0.8"
pingora-core = "0.8"
pingora-proxy = "0.8"
pingora-http = "0.8"
pingora-timeout = "0.8"
pingora-load-balancing = "0.8"
pingora-limits = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Configuration parsing
logos = "0.16"
ariadne = "0.6"      # error reporting

# TLS / certificates
rustls = { version = "0.23", features = ["ring"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"

# HTTP/3 (QUIC) — Cloudflare quiche on BoringSSL, with a hand-written event
# loop in `pingclair-proxy/src/quic.rs`.
#
# ⚠️ The note that used to sit here — "tokio-quiche was evaluated and rejected:
# its server-side accept API is pub(crate)" — was WRONG, and it was wrong in the
# way a rejection note is most harmful: it stopped anyone re-examining the
# question. Only the internal `quic::start_listener()` is `pub(crate)`. The
# facade is public, verified against `tokio-quiche 0.19.1` on 2026-07-30:
# `tokio_quiche::listen()` (lib.rs:191), plus `ServerH3Driver`,
# `ServerH3Controller`, `InitialQuicConnection` and `ApplicationOverQuic`.
#
# The dependency versions align exactly — it pulls `quiche 0.29.3` and
# `boring 4.22.0`, the same ones below, with no `openssl-sys` anywhere — so the
# single-BoringSSL invariant survives the migration. Verified in this workspace,
# not in a probe crate: `cargo tree -i boring-sys` shows one `boring-sys 4.22.0`
# shared by `pingora-boringssl`, `quiche` and `tokio-quiche`, and
# `cargo tree -i openssl-sys` matches no package at all.
#
# 🔐 The blocker was TLS, not the accept API: `ConnectionParams` demands a
# `TlsCertificatePaths`, which looks like it forces private keys onto disk. It
# does not. The paths are only handed to `ConnectionHook`; their sole reader,
# `quiche_config_with_tls` (settings/config.rs:224 in 0.19.1), is the branch
# taken when the hook returns `None`. A hook returning `Some(builder)` means the
# paths are never opened, so certificates stay in the in-memory `CertTable`.
# Proven by `pingclair-proxy/tests/h3_in_memory_certs.rs` against real
# handshakes, including red-first: with the hook declining, every one of those
# tests fails `TlsFail`.
#
# ⚠️ The cost is not free — `tokio-quiche` depends unconditionally on
# `foundations` (feature `server-client-common-default`), which adds 86 crates
# to the lock file, `tonic`/`prost` (gRPC, for OTLP export) among them.
quiche = "0.29"
boring = "4.22"   # must stay on the same release quiche 0.29 links against
# Pinned: the ConnectionHook/tls_cert behaviour documented above was read from
# 0.19.1's source. A minor bump could start reading the sentinel paths.
tokio-quiche = { version = "=0.19.1", default-features = false }

# HTTP
http = "1"
bytes = "1"
h2 = "0.4"
mime_guess = "2"
ipnet = "2"
libc = "0.2"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.14"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
criterion = "0.8"

# File system
dirs = "6"

# String handling
smartstring = "1"

# 🔐 Password hashing support.
bcrypt = "0.19"

# Lock-free reads on hot paths
arc-swap = "1"

# ⚡ Performance fork (Pingclair-local, tracked under `vendor/`)
#
# `h2 0.4.15` is forked with one change: the HPACK encoder reuses a
# per-connection scratch buffer for the encoded header block instead of
# allocating a fresh `BytesMut` (with several capacity doublings) plus a
# `Bytes` refcount header on every HEADERS frame. The common
# no-continuation path now performs zero header-block allocations per
# request. See `vendor/h2/PINGCLAIR_PATCH.md` for the exact diff.
#
# 🎯 This is the last fork standing, and the only one ever measured against
# the upstream project's own benchmark rather than ours: +3.8 % on h2's
# multi-threaded 100k-request bench, faster in 24 of 25 pairwise comparisons
# (exact permutation test, p = 0.016).
#
# ✅ Upstream accepted it. hyperium/h2#929 was merged on 2026-08-03 as
# `27b730ee2b10617bc79c4588b05e64afe2d1a432`, verbatim — `git diff` between
# the submitted commit and h2 master is empty for both patched files. So this
# directory is not a divergence from upstream any more; it is upstream, early.
#
# ⏳ Merged is not released. The newest h2 release is still `0.4.15`
# (2026-06-15), which predates the merge, so deleting `vendor/h2` today would
# give the optimization back until h2 cuts its next release. Keep the patch
# until an h2 release contains the commit above, then delete `vendor/h2`,
# this `[patch]` section, `scripts/check-vendored-h2.sh`, its `lint.yml` step,
# and the second audit pass in `security-audit.yml` — the whole apparatus
# exists only to hold this one fork safely.
#
# 🚫 Two other forks were evaluated and removed on 2026-08-04, both for the
# same reason — a plausible mechanism that never showed up in a measurement
# where the proxy was provably the bottleneck:
#
#   - `pingora-http` (titled-header map plus `drop_case()`): no isolated
#     A/B ever existed, and the c7i-flex run that shipped with it concluded
#     the remaining proxy gap is "framework-level H1 handling, not
#     header-case allocation". It also silently lowercased `Authorization`,
#     `Cookie` and `User-Agent` on the upstream wire.
#   - `pingora-core` (H1 `BodyReader` buffer reuse): cut cumulative
#     allocations 86 % and moved nothing else. Three independent attempts
#     agree — local profile CPU/request 51.6 vs 49.3 µs (noise), OrbStack
#     A/B +0.9 % throughput with RSS ranges fully overlapping, and the
#     published c7i-flex table still 55 % behind nginx on H1 proxy.
#
# The standing rule this leaves behind: a fork needs a number from a run
# where the thing it patches is the saturated resource, or it does not go
# in. Vendoring also removes `source`/`checksum` from the lockfile entry,
# which makes the crate invisible to `cargo audit` — verified directly.
[patch.crates-io]
h2 = { path = "vendor/h2" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
