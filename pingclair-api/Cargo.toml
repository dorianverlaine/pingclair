[package]
name = "pingclair-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Admin REST API for Pingclair"

[dependencies]
# 🔐 Constant-time comparison for the Admin API key. Already in the tree at one
# version through `bcrypt`; naming it only makes the API reachable.
subtle = "2.6"
pingclair-core = { path = "../pingclair-core" }
# 🛡️ The Admin API must reach the canonical validator, not re-implement
# a second set of rules that drifts from the Pingclairfile path.
pingclair-config = { path = "../pingclair-config" }
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.0"
pingclair-proxy = { path = "../pingclair-proxy" }
parking_lot = "0.12"

