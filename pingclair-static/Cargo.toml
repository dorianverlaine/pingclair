[package]
name = "pingclair-static"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Static file server module for Pingclair"

[dependencies]
pingclair-core = { path = "../pingclair-core" }
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
http.workspace = true
arc-swap.workspace = true
mime_guess.workspace = true
httpdate = "1.0"
# 🙈 `hide` patterns are globs, matched exactly as upstream matches them.
# Already in the dependency tree; naming it only makes the API reachable.
glob = "0.3"
# 🔗 Link targets in a browse listing are percent-encoded, which is what stops a
# filename from being read as a scheme or cutting the URL short. Already in the
# tree at one version; naming it only makes the API reachable.
percent-encoding = "2.3"
async-compression = { version = "0.4", features = ["gzip", "brotli", "zstd", "tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros", "io-util", "time"] }
tempfile = "3"
flate2 = "1"

[lints]
workspace = true
