[package]
name = "pingclair-tls"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TLS and ACME automation for Pingclair"

[dependencies]

tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
rustls.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
serde.workspace = true
thiserror.workspace = true

# ACME (Let's Encrypt)
instant-acme = "0.8"
tokio-rustls = "0.26"

# Certificate parsing
rustls-pemfile = "2"

# ☁️ The DNS-01 provider's HTTP client. Every one of these is already linked
# into the binary through `instant-acme`, which depends on them unconditionally
# with these same features — naming them here only makes the API reachable and
# adds no crate to the dependency tree. Deliberately not reqwest.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "webpki-roots"] }
http-body-util = "0.1"

# 🔎 Checking a TXT record has propagated. Already in the tree via the proxy's
# dynamic upstream resolution.
hickory-resolver.workspace = true

# Serialization
serde_json = "1"

# File system
dirs.workspace = true
parking_lot = "0.12"
# 🗺️ The challenge policy is published once and read by every issuance.
arc-swap.workspace = true

# Testing
tempfile = "3"

[lints]
workspace = true
