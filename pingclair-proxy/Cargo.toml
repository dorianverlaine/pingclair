[package]
name = "pingclair-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reverse proxy module for Pingclair"

[dependencies]

pingclair-core = { path = "../pingclair-core" }
pingclair-static = { path = "../pingclair-static" }
pingclair-tls = { path = "../pingclair-tls" }

pingora-proxy.workspace = true
# 🗄️ Already linked into the binary through pingora-proxy, which depends on it
# unconditionally. Naming it here only makes the API reachable — it adds no
# crate to the dependency tree.
pingora-cache = { version = "0.8.1", default-features = false, features = ["boringssl"] }
pingora-load-balancing.workspace = true
pingora-limits.workspace = true
pingora-core = { workspace = true, features = ["boringssl", "connection_filter"] }
pingora-http.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
http.workspace = true
bytes.workspace = true
parking_lot = "0.12"
prometheus.workspace = true
async-recursion = "1.0"
ipnet.workspace = true
flate2 = "1.0"
zstd = "0.13"
arc-swap.workspace = true
regex = "1"
futures = "0.3"

# HTTP/3 (QUIC) — quiche + BoringSSL
quiche.workspace = true
tokio-quiche.workspace = true
boring.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
rcgen.workspace = true
h2.workspace = true
proptest = "1"
